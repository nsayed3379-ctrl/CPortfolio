version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: vicosoft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vicosoft
      POSTGRES_PASSWORD: vicosoft
      POSTGRES_DB: vicosoft
    ports:
      - "5432:5432"
    volumes:
      - vicosoft_pgdata:/var/lib/postgresql/data
volumes:
  vicosoft_pgdata:
